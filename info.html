<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Contact Info</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <style>
        body{
            background-color: darkred;
        }
        h1{
            color: rgb(147, 75, 254);
        }
        .cardlabel{
            font-size: 11px; color: darkkhaki; text-transform: uppercase;
        }
        pre{
            font-size: 13px; color: rgb(148, 99, 34);
        }
    </style>
  </head>  
  <body class="py-4">
    <div class="container">
        <h1 class="mb-1">My Contacts</h1>
        <p  style="color: rgb(255, 239, 161);">Introduction to some sort of objects in javascript</p>

        <div class="card shadow-sm mb-3" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title" style=" color: blueviolet;">Contact Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card-label d-block">Name</span>
                        <strong id="name">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Phone</span>
                        <strong id="phone">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">School</span>
                        <strong id="school">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">City</span>
                        <strong id="city">-</strong>
                    </li>
                </ul>
            </div>
        </div>

        <div class="card-shadow-sm" style="max-width: 400px;">
            <div class="card-body">
                <h6 style="color: cornflowerblue;">Javascript object used</h6>
                <pre id="codeDisplay"class="bg-light p-3 rounded border mb-0" ></pre>
            </div>
        </div>
    
    </div> <!-- /container -->

    <script>
        var myContact = {
            name: "Eva Dil",
            phone: "1234567890",
            school: "Bolsover School",
            city: "Chesterfield",
        };

        // Step 2 — Dot notation
    var nameEl  = document.getElementById("name");
    var phoneEl = document.getElementById("phone");
    nameEl.textContent  = myContact.name;
    phoneEl.textContent = myContact.phone;

    // Step 3 — Bracket notation
    var schoolEl = document.getElementById("school");
    var cityEl   = document.getElementById("city");
    schoolEl.textContent = myContact["school"];
    cityEl.textContent   = myContact["city"];

        var codeEl = document.getElementById("codeDisplay");
    codeEl.textContent =
      'var myContact = {\n' +
      '  name:   "' + myContact.name + '",\n' +
      '  phone:  "' + myContact.phone + '",\n' +
      '  school: "' + myContact["school"] + '",\n' +
      '  city:   "' + myContact["city"] + '"\n' +
      '};';

    </script>
  </body>
</html>
